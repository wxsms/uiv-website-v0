name: Deploy

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.20.0
          cache: yarn
      - name: Install
        run: yarn --frozen-lockfile
      # System libs required by the Chromium bundled with puppeteer 1.x
      - name: Install Puppeteer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-0 libnss3 libnspr4 libdbus-1-3 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libatspi2.0-0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libpango-1.0-0 libcairo2 libasound2t64
      - name: Build
        run: npm run build
        env:
          # Webpack 4 uses md4 hashes internally (ModuleConcatenationPlugin,
          # Terser, ...) which are unavailable in Node 17+ (OpenSSL 3)
          NODE_OPTIONS: --openssl-legacy-provider
      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          target_branch: gh-pages
          build_dir: dist
          jekyll: false
